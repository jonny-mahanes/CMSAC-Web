<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Girls Basketball Schedule & Results | CMSAC</title>
  <meta name="description" content="CMSAC Girls Basketball Schedule and Results">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html" aria-label="CMSAC Home">
    <img src="assets/cmsac-logo-banner.jpg" alt="CMSAC - Commonwealth Middle School Athletic Conference">
  </a>

  <nav class="topnav gb-nav" aria-label="Schedule navigation">
    <a href="girls-basketball.html">← Girls Basketball</a>
    <a href="index.html">Home</a>
  </nav>
</header>

<main class="gbs-page">

  <section class="gbs-heading">
    <div>
      <span class="gbs-kicker">CMSAC GIRLS BASKETBALL</span>
      <h1>Schedule &amp; Results</h1>
      <p id="scheduleSubtitle">
        Loading the current conference schedule...
      </p>
    </div>

    <div class="gbs-controls">
      <div class="gbs-filter-group">
        <label for="schoolFilter">SCHOOL</label>
        <select id="schoolFilter" aria-label="Choose school schedule" disabled>
          <option value="ALL" selected>ALL SCHOOLS</option>
        </select>
      </div>

      <div class="gbs-filter-group">
        <label for="teamFilter">TEAM</label>
        <select id="teamFilter" aria-label="Choose team schedule" disabled>
          <option value="ALL" selected>ALL TEAMS</option>
        </select>
      </div>

      <button class="gbs-print" type="button" onclick="window.print()">
        Print Schedule
      </button>
    </div>
  </section>

  <section class="gbs-api-status" id="apiStatus">
    Loading live CMSAC schedule data...
  </section>

  <section id="scheduleList" class="gbs-list" aria-live="polite"></section>

  <section id="emptyState" class="gbs-empty" hidden>
    No games are currently available for this school/team selection.
  </section>

</main>

<script>
  const API_URL =
    "https://script.google.com/macros/s/AKfycbxxOoHFjaBhHs46Jq3-9cikIg7SKXUkDHMw0EpRlmg7Dz0sW35w4Fy1luoRZU9FJEFS/exec?action=girlsBasketballSchedule";

  const schoolFilter =
    document.getElementById("schoolFilter");

  const teamFilter =
    document.getElementById("teamFilter");

  const scheduleList =
    document.getElementById("scheduleList");

  const emptyState =
    document.getElementById("emptyState");

  const apiStatus =
    document.getElementById("apiStatus");

  const scheduleSubtitle =
    document.getElementById("scheduleSubtitle");

  let scheduleData = {
    schools: [],
    divisions: [],
    seasons: [],
    games: []
  };


  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function divisionLabel(value) {
    const clean = String(value || "").toUpperCase();

    if (clean === "6TH") return "6TH GRADE";
    if (clean === "7TH") return "7TH GRADE";
    if (clean === "8TH") return "8TH GRADE";

    return clean || "TEAM";
  }


  function statusClass(status) {
    const clean = String(status || "").toUpperCase();

    if (clean === "COMPLETED") return "completed";
    if (clean === "CANCELLED") return "cancelled";
    if (clean === "CLOSED") return "closed";

    return "scheduled";
  }


  function parseCmsacDate(value) {
    const text = String(value || "").trim();

    const match =
      text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);

    if (!match) {
      const fallback = new Date(text);
      return Number.isNaN(fallback.getTime())
        ? null
        : fallback;
    }

    let year = Number(match[3]);

    if (year < 100) {
      year += 2000;
    }

    return new Date(
      year,
      Number(match[1]) - 1,
      Number(match[2])
    );
  }


  function formatDateLabel(value) {
    const date = parseCmsacDate(value);

    if (!date) {
      return String(value || "").toUpperCase();
    }

    return date
      .toLocaleDateString(
        "en-US",
        {
          weekday: "long",
          month: "long",
          day: "numeric"
        }
      )
      .toUpperCase();
  }


  function buildFilters() {
    schoolFilter.innerHTML =
      '<option value="ALL">ALL SCHOOLS</option>';

    (scheduleData.schools || []).forEach(school => {
      const option = document.createElement("option");
      option.value = school;
      option.textContent = school.toUpperCase();
      schoolFilter.appendChild(option);
    });

    teamFilter.innerHTML =
      '<option value="ALL">ALL TEAMS</option>';

    (scheduleData.divisions || []).forEach(division => {
      const option = document.createElement("option");
      option.value = division;
      option.textContent = divisionLabel(division);
      teamFilter.appendChild(option);
    });

    schoolFilter.disabled = false;
    teamFilter.disabled = false;
  }


  function groupGames(games) {
    const groups = new Map();

    games.forEach(game => {
      const key =
        game.plannerMatchupId ||
        [
          game.gameDate,
          game.awaySchool,
          game.homeSchool
        ].join("|");

      if (!groups.has(key)) {
        groups.set(
          key,
          {
            id: key,
            date: game.gameDate,
            away: game.awaySchool,
            home: game.homeSchool,
            venue: game.venue || "",
            games: []
          }
        );
      }

      groups.get(key).games.push(game);
    });

    const divisionOrder = {
      "6TH": 1,
      "7TH": 2,
      "8TH": 3
    };

    return Array.from(groups.values())
      .map(group => {
        group.games.sort(
          (a, b) =>
            (divisionOrder[a.division] || 99) -
            (divisionOrder[b.division] || 99)
        );

        return group;
      });
  }


  function renderGameRow(game, matchup) {
    const completed =
      String(game.gameStatus || "").toUpperCase() ===
      "COMPLETED";

    const hasScore =
      game.awayScore !== null &&
      game.awayScore !== undefined &&
      game.homeScore !== null &&
      game.homeScore !== undefined;

    let middleContent = "";

    if (completed && hasScore) {
      middleContent = `
        <div class="gbs-score">
          <span>
            ${escapeHtml(matchup.away)}
            <b>${escapeHtml(game.awayScore)}</b>
          </span>
          <span>
            ${escapeHtml(matchup.home)}
            <b>${escapeHtml(game.homeScore)}</b>
          </span>
        </div>
      `;
    } else {
      middleContent = `
        <div class="gbs-opponents">
          <span>${escapeHtml(matchup.away)}</span>
          <span class="gbs-at">@</span>
          <span>${escapeHtml(matchup.home)}</span>
        </div>
      `;
    }

    return `
      <div class="gbs-game-row">
        <div class="gbs-division">
          ${escapeHtml(game.division)}
        </div>

        <div class="gbs-time">
          ${escapeHtml(game.gameTime || "TBA")}
        </div>

        ${middleContent}

        <div class="gbs-game-status ${statusClass(game.gameStatus)}">
          ${escapeHtml(game.gameStatus || "SCHEDULED")}
        </div>
      </div>
    `;
  }


  function renderSchedule() {
    const selectedSchool =
      schoolFilter.value;

    const selectedTeam =
      teamFilter.value;

    const filteredGames =
      (scheduleData.games || []).filter(game => {
        const schoolMatches =
          selectedSchool === "ALL" ||
          game.awaySchool === selectedSchool ||
          game.homeSchool === selectedSchool;

        const teamMatches =
          selectedTeam === "ALL" ||
          game.division === selectedTeam;

        return schoolMatches && teamMatches;
      });

    const matchups =
      groupGames(filteredGames);

    scheduleList.innerHTML = "";

    matchups.forEach(matchup => {
      const card =
        document.createElement("article");

      card.className = "gbs-matchup";

      card.innerHTML = `
        <div class="gbs-matchup-head">
          <div class="gbs-date">
            ${escapeHtml(formatDateLabel(matchup.date))}
          </div>

          <div class="gbs-matchup-title">
            <strong>${escapeHtml(matchup.away)}</strong>
            <span>at</span>
            <strong>${escapeHtml(matchup.home)}</strong>
          </div>

          <div class="gbs-venue">
            ${escapeHtml(matchup.venue || "Venue TBA")}
          </div>
        </div>

        <div class="gbs-games">
          ${
            matchup.games
              .map(game => renderGameRow(game, matchup))
              .join("")
          }
        </div>
      `;

      scheduleList.appendChild(card);
    });

    emptyState.hidden =
      matchups.length !== 0;
  }


  async function loadSchedule() {
    try {
      apiStatus.className =
        "gbs-api-status loading";

      apiStatus.textContent =
        "Loading live CMSAC schedule data...";

      const response =
        await fetch(
          API_URL,
          {
            method: "GET",
            cache: "no-store"
          }
        );

      if (!response.ok) {
        throw new Error(
          "Schedule service returned HTTP " +
          response.status
        );
      }

      const payload =
        await response.json();

      if (!payload || payload.ok !== true) {
        throw new Error(
          payload && payload.error
            ? payload.error
            : "Schedule service did not return a valid response."
        );
      }

      scheduleData = {
        schools:
          Array.isArray(payload.schools)
            ? payload.schools
            : [],

        divisions:
          Array.isArray(payload.divisions)
            ? payload.divisions
            : ["6TH", "7TH", "8TH"],

        seasons:
          Array.isArray(payload.seasons)
            ? payload.seasons
            : [],

        games:
          Array.isArray(payload.games)
            ? payload.games
            : []
      };

      buildFilters();

      const seasonText =
        scheduleData.seasons.length
          ? scheduleData.seasons.join(", ")
          : "Current Season";

      scheduleSubtitle.textContent =
        seasonText +
        " conference schedule for 6th, 7th and 8th grade teams. " +
        "Use the School and Team filters only when you want to narrow the schedule.";

      apiStatus.className =
        "gbs-api-status ready";

      apiStatus.textContent =
        "Live CMSAC schedule • " +
        scheduleData.games.length +
        " individual game records loaded";

      renderSchedule();

    } catch (error) {
      console.error(error);

      schoolFilter.disabled = true;
      teamFilter.disabled = true;

      apiStatus.className =
        "gbs-api-status error";

      apiStatus.textContent =
        "The live schedule could not be loaded. Please refresh the page or try again shortly.";

      scheduleList.innerHTML = "";
      emptyState.hidden = true;
    }
  }


  schoolFilter.addEventListener(
    "change",
    renderSchedule
  );

  teamFilter.addEventListener(
    "change",
    renderSchedule
  );

  loadSchedule();
</script>

</body>
</html>
